services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mubarek_portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_password
    ports:
      - "5432:5432"
    volumes:
      - portfolio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d mubarek_portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio_postgres: