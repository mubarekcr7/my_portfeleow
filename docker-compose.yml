services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mubarek_portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio_dev_password
      MYSQL_ROOT_PASSWORD: mysql_root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - portfolio_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql_root_dev_password --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio_mysql:
